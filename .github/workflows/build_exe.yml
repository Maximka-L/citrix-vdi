name: Build Citrix Fix Executable

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Compile C# Executable
        shell: powershell
        run: |
          $csc = "C:\Windows\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          if (-not (Test-Path $csc)) {
              $csc = "C:\Windows\Microsoft.NET\Framework\v4.0.30319\csc.exe"
          }
          Write-Host "Compiling with $csc..."
          & $csc /target:winexe /r:System.Windows.Forms.dll /r:System.Drawing.dll /out:Citrix_Fix.exe src\Program.cs
          Copy-Item Citrix_Fix.exe -Destination "Починить_Citrix.exe"
          Write-Host "File size: $((Get-Item Citrix_Fix.exe).Length) bytes"

      - name: Upload to Release v1.0
        uses: softprops/action-gh-release@v2
        if: always()
        with:
          tag_name: v1.0
          files: |
            Citrix_Fix.exe
            Починить_Citrix.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
